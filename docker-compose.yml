services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${FLOWOS_DATABASE_NAME:-flowos}
      POSTGRES_USER: ${FLOWOS_DATABASE_USER:-flowos}
      POSTGRES_PASSWORD: ${FLOWOS_DATABASE_PASSWORD:-flowos_dev_only}
    ports:
      - "5432:5432"
    volumes:
      - flowos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      FLOWOS_DATABASE_HOST: db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "uv run --no-sync alembic upgrade head && uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port 8000"]

volumes:
  flowos_postgres_data:
